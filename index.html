<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ziko l'écolo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1c1a24;
        overflow: hidden;
        /* Phones: no pull-to-refresh, no double-tap zoom, no text selection. */
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* Keep the game away from notches and rounded corners. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: linear-gradient(#195733, #50883e);
        color: #fff6e3;
        font: 700 28px 'Baloo 2', 'Trebuchet MS', sans-serif;
        text-shadow: 0 3px 0 #4a3426;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
      }
      #rotate .icon { font-size: 72px; animation: turn 1.6s ease-in-out infinite; }
      .tile-dialog { box-sizing: border-box; width: min(28rem, 88vw); padding: 1.4rem 1.8rem; border: 4px solid #473522; border-radius: 22px; background: #fff6e3; color: #403122; box-shadow: 0 6px 0 #57432e; font: 1.15rem 'Baloo 2', sans-serif; text-align: center; }
      .tile-dialog::backdrop { background: #201c1880; }
      .tile-dialog h2 { margin: 0; color: #255339; }
      .tile-dialog button { min-height: 44px; padding: .35em 1em; font: inherit; font-weight: 700; color: inherit; background: linear-gradient(#ffe676,#ffc035); border: 3px solid #255339; border-radius: 16px; box-shadow: 0 3px 0 #986624; cursor: pointer; }
      #rotate .message { background: #fff6e3; color: #4a3426; border: 4px solid #4a3426; border-radius: 24px; padding: 12px 22px; text-shadow: none; box-shadow: 0 6px 0 #153b24; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      /* Small screens held in portrait: the game is designed for landscape (16:9). */
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="icon">📱</div>
      <div class="message">Tourne ton téléphone<br />pour jouer avec Ziko ! 🌱</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
